    "/v1/videos/{request_id}/content": {
      "get": {
        "summary": "流式中继下载原文件，不落盘和缓存完整 MP4",
        "description": "API Key 必须属于当前用户；原任务归属固定，查询和下载不会触发新的生成收费。",
        "security": [
          {
            "PlatformAPIKey": []
          }
        ],
        "responses": {
          "200": {
            "description": "完整文件或 HEAD 元数据",
            "content": {
              "video/mp4": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "206": {
            "description": "部分内容",
            "content": {
              "video/mp4": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "416": {
            "description": "范围不满足",
            "content": {
              "video/mp4": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Range",
            "in": "header",
            "description": "单段字节范围",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Range",
            "in": "header",
            "description": "原文件强 ETag 或 Last-Modified",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "request_id",
            "in": "path",
            "required": true,
            "description": "本地任务或已有实体编号",
            "schema": {
              "type": "string"
            }
          }
