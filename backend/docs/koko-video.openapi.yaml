{
  "openapi": "3.0.3",
  "info": {
    "title": "Sub2API 视频创作",
    "version": "6.6.6",
    "description": "独立 video 平台，目前只开放 oo-sd25-1080p，固定 1080P。参数限制以 GET /models 实时返回为准。创建请求先保存本地持久任务，202 返回后由服务器后台提交；高峰提交允许等待十分钟，浏览器每六十秒更新本站记录。成功结算一次，失败解冻一次。"
  },
  "paths": {
    "/v1/videos": {
      "post": {
        "summary": "创建视频任务并原子冻结费用",
        "description": "API Key 必须属于当前用户；原任务归属固定，查询和下载不会触发新的生成收费。",
        "security": [
          {
            "PlatformAPIKey": []
          }
        ],
        "responses": {
          "202": {
            "description": "成功响应",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VideoTask"
                }
              }
            }
          },
          "400": {
            "description": "参数、权限或能力拒绝",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VideoErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "任务不存在或无权访问"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VideoCreateRequest"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "description": "8–100 位字母、数字、下划线或横线；重试必须保持原键和原参数。",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{8,100}$"
            }
          }
        ]
      },
      "get": {
        "summary": "分页查询当前 Key 和原分组的视频任务",
        "description": "API Key 必须属于当前用户；原任务归属固定，查询和下载不会触发新的生成收费。",
        "security": [
          {
            "PlatformAPIKey": []
          }
        ],
        "responses": {
          "200": {
            "description": "成功响应",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VideoListResponse"
                }
              }
            }
          },
          "400": {
            "description": "参数、权限或能力拒绝",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VideoErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "任务不存在或无权访问"
          }
        },
        "parameters": [
          {
            "name": "before",
            "in": "query",
            "description": "上一页 next_cursor；每页最多 100 条。",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "idempotency_key",
            "in": "query",
            "description": "只读确认原提交，不创建任务。",
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
